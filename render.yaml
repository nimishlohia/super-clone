services:
  # Single Unified Service: Serves both Next.js Frontend and FastAPI Backend on 1 Single URL
  - type: web
    name: signal-clone
    env: python
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.17.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./signal.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PYTHONPATH
        value: .

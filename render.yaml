services:
  # 1. FastAPI Backend Service
  - type: web
    name: signal-clone-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./signal.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: PYTHONPATH
        value: .

  # 2. Next.js Frontend Service
  - type: web
    name: signal-clone-frontend
    env: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_BACKEND_HOST
        fromService:
          type: web
          name: signal-clone-backend
          property: host
